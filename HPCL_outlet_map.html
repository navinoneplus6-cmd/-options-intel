  const lat = o.lat.toFixed(6), lng = o.lng.toFixed(6);

const distSel = document.getElementById('dist');
[...new Set(OUTLETS.map(o=>o.d))].sort().forEach(d=>{
  const op=document.createElement('option'); op.value=d; op.textContent=d; distSel.appendChild(op);
});

function render(fit){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const d = distSel.value;
  group.clearLayers();
  const shown = markers.filter(({o}) =>
    (!d || o.d===d) && (!q || (o.n+' '+o.s+' '+o.l+' '+o.d).toLowerCase().includes(q)));
  shown.forEach(({m}) => group.addLayer(m));
  document.getElementById('count').textContent = shown.length + ' / ' + OUTLETS.length;
  if (fit && shown.length) map.fitBounds(L.latLngBounds(shown.map(({o})=>[o.lat,o.lng])).pad(0.1));
  return shown;
}
