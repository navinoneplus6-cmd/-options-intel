<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Options Intelligence</title>
<style>
:root{--bg:#0c0e11;--surf:#13161a;--card:#1a1d22;--bdr:rgba(255,255,255,0.07);--bdr2:rgba(255,255,255,0.13);--txt:#e8eaed;--muted:#7a8390;--faint:#3a4048;--grn:#22c55e;--red:#ef4444;--amb:#f59e0b;--blu:#3b82f6;--grn-bg:rgba(34,197,94,0.12);--red-bg:rgba(239,68,68,0.12);--amb-bg:rgba(245,158,11,0.12);--blu-bg:rgba(59,130,246,0.12);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:15px;}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto;}
.topbar{background:var(--surf);border-bottom:1px solid var(--bdr);padding:12px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:10;}
.logo{font-size:14px;font-weight:700;letter-spacing:0.04em;color:var(--txt);}.logo span{color:var(--grn);}
.tb-sp{flex:1;}
.pill{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;}
.p-live{background:var(--grn-bg);color:var(--grn);border:1px solid rgba(34,197,94,0.3);}
.p-off{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,0.3);}
.p-mkt{background:var(--blu-bg);color:var(--blu);border:1px solid rgba(59,130,246,0.3);}
.p-cls{background:var(--faint);color:var(--muted);border:1px solid var(--bdr);}
.tb-time{font-size:11px;color:var(--muted);}
.botnav{background:var(--surf);border-top:1px solid var(--bdr);display:flex;position:sticky;bottom:0;z-index:10;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;cursor:pointer;border:none;background:transparent;color:var(--muted);}
.nav-btn.on{color:var(--grn);}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.nav-lbl{font-size:10px;font-weight:500;}
.content{flex:1;}
.page{display:none;padding:14px 14px 20px;}
.page.active{display:block;}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px;}
.mc{background:var(--card);border-radius:10px;padding:12px 14px;}
.mc-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;}
.mc-v{font-size:20px;font-weight:700;}
.mc-s{font-size:11px;color:var(--muted);margin-top:2px;}
.g{color:var(--grn);}.r{color:var(--red);}.a{color:var(--amb);}.b{color:var(--blu);}
.sec-hdr{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.sig-card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:10px;}
.sig-card.buy{border-color:rgba(34,197,94,0.35);}
.sig-card.watch{border-color:rgba(245,158,11,0.3);}
.sc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.sc-sym{font-size:17px;font-weight:700;}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.bce{background:var(--grn-bg);color:var(--grn);}
.bpe{background:var(--red-bg);color:var(--red);}
.sc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin-bottom:10px;}
.sc-fl{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:0.04em;}
.sc-fv{font-size:14px;font-weight:700;}
.sc-reason{font-size:12px;color:var(--muted);line-height:1.5;border-top:1px solid var(--bdr);padding-top:8px;margin-bottom:8px;}
.sc-verdict{text-align:center;font-size:13px;font-weight:700;padding:8px;border-radius:8px;}
.sv-buy{background:rgba(34,197,94,0.1);color:var(--grn);}
.sv-watch{background:rgba(245,158,11,0.1);color:var(--amb);}
.oi-item{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.oi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.oi-sym{font-size:14px;font-weight:700;}
.oi-pcr{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;}
.oi-track{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-bottom:5px;}
.oi-ce{background:var(--grn);}
.oi-pe{background:var(--red);}
.oi-labels{display:flex;justify-content:space-between;font-size:11px;}
.sym-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none;}
.sym-tabs::-webkit-scrollbar{display:none;}
.sym-tab{flex-shrink:0;font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px;border:1px solid var(--bdr);background:var(--card);color:var(--muted);cursor:pointer;}
.sym-tab.on{background:var(--grn);color:#000;border-color:transparent;}
.chain-wrap{overflow-x:auto;background:var(--card);border-radius:12px;margin-bottom:12px;}
.chain-tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:340px;}
.chain-tbl th{font-size:10px;color:var(--faint);text-transform:uppercase;padding:8px 8px 6px;text-align:center;border-bottom:1px solid var(--bdr);white-space:nowrap;}
.chain-tbl td{padding:7px 8px;border-bottom:1px solid var(--bdr);text-align:center;white-space:nowrap;}
.chain-tbl tr:last-child td{border-bottom:none;}
.chain-tbl .atm td{background:rgba(59,130,246,0.07);}
.cce{color:var(--grn);font-weight:700;}.cpe{color:var(--red);font-weight:700;}.cstrike{font-weight:700;}
.chk-form{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;}
.chk-lbl{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5;}
.chk-row{display:flex;gap:8px;margin-bottom:8px;}
.chk-input{flex:1;background:var(--surf);border:1px solid var(--bdr2);border-radius:8px;color:var(--txt);font-size:14px;padding:10px 12px;outline:none;}
.chk-select{background:var(--surf);border:1px solid var(--bdr2);border-radius:8px;color:var(--txt);font-size:14px;padding:10px 12px;outline:none;}
.chk-btn{width:100%;background:var(--blu);border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:700;padding:12px;cursor:pointer;}
.chk-result{display:none;background:var(--card);border-radius:12px;padding:14px;}
.cr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.cr-title{font-size:16px;font-weight:700;}
.score-bar-bg{height:7px;background:var(--bdr);border-radius:4px;overflow:hidden;margin:8px 0 4px;}
.score-bar-fill{height:100%;border-radius:4px;}
.cr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0;}
.cr-cell{background:var(--surf);border-radius:8px;padding:10px 12px;text-align:center;}
.cr-cl{font-size:10px;color:var(--faint);text-transform:uppercase;margin-bottom:3px;}
.cr-cv{font-size:16px;font-weight:700;}
.cr-reasons{font-size:12px;color:var(--muted);line-height:1.7;}
.exit-item{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:10px;}
.ei-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.ei-sym{font-size:15px;font-weight:700;}
.ei-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;}
.ei-hold{background:var(--blu-bg);color:var(--blu);}
.ei-exit{background:var(--red-bg);color:var(--red);}
.ei-pnl{font-size:18px;font-weight:700;margin-bottom:4px;}
.ei-body{font-size:12px;color:var(--muted);line-height:1.6;}
.status-banner{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);}
.pulse-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pulse-dot.live{background:var(--grn);animation:pulse 1.4s infinite;}
.pulse-dot.off{background:var(--red);}
.pulse-dot.wait{background:var(--amb);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}
.err-box{background:var(--red-bg);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:12px;color:var(--red);line-height:1.5;}
.skel{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;}
.skel-line{height:12px;background:var(--bdr2);border-radius:4px;margin-bottom:8px;}
.skel-line.s{width:55%;}
.retry-btn{width:100%;background:transparent;border:1px solid var(--bdr2);border-radius:10px;color:var(--muted);font-size:13px;font-weight:600;padding:12px;cursor:pointer;margin-bottom:14px;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">OPTIONS <span>INTEL</span></div>
    <span class="pill p-off" id="conn-pill">Loading…</span>
    <div class="tb-sp"></div>
    <span class="pill p-cls" id="mkt-pill">—</span>
    <span class="tb-time" id="clock">--:--</span>
  </div>

  <div class="content">
    <div class="page active" id="pg-signals">
      <div class="status-banner" id="status-banner">
        <div class="pulse-dot wait" id="pulse"></div>
        <span id="status-txt">Connecting to NSE…</span>
      </div>
      <button class="retry-btn" onclick="fetchAll()">↻ Refresh data</button>
      <div class="metrics">
        <div class="mc"><div class="mc-l">India VIX</div><div class="mc-v a" id="vix-val">—</div><div class="mc-s" id="vix-sub">—</div></div>
        <div class="mc"><div class="mc-l">Signals</div><div class="mc-v b" id="sig-count">0</div><div class="mc-s">ranked by score</div></div>
      </div>
      <div class="sec-hdr">09:15 – 09:30 signals</div>
      <div id="signals-list"><div class="skel"><div class="skel-line"></div><div class="skel-line s"></div><div class="skel-line"></div></div><div class="skel"><div class="skel-line"></div><div class="skel-line s"></div></div></div>
    </div>

    <div class="page" id="pg-oi">
      <div class="sec-hdr" style="margin-bottom:12px">OI ratio — CE vs PE</div>
      <div id="oi-list"></div>
      <div class="sec-hdr" style="margin-top:6px;margin-bottom:10px">OI chain</div>
      <div class="sym-tabs" id="chain-tabs"></div>
      <div id="chain-container"></div>
    </div>

    <div class="page" id="pg-checker">
      <div class="chk-form">
        <div class="chk-lbl">Enter an option — get a live score based on OI, IV, PCR and VIX.</div>
        <div class="chk-row"><input class="chk-input" id="chk-sym" placeholder="Symbol (NIFTY, RELIANCE…)" autocapitalize="characters" autocorrect="off"/></div>
        <div class="chk-row">
          <input class="chk-input" id="chk-strike" placeholder="Strike (e.g. 24300)" inputmode="numeric"/>
          <select class="chk-select" id="chk-type"><option value="CE">CE Call</option><option value="PE">PE Put</option></select>
        </div>
        <button class="chk-btn" onclick="runChecker()">Analyse →</button>
      </div>
      <div class="chk-result" id="chk-result"></div>
    </div>

    <div class="page" id="pg-exit">
      <div class="sec-hdr" style="margin-bottom:10px">Exit monitor</div>
      <div id="exit-list"></div>
    </div>
  </div>

  <div class="botnav">
    <button class="nav-btn on" onclick="nav('signals',this)">
      <svg viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      <span class="nav-lbl">Signals</span>
    </button>
    <button class="nav-btn" onclick="nav('oi',this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span class="nav-lbl">OI Chain</span>
    </button>
    <button class="nav-btn" onclick="nav('checker',this)">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      <span class="nav-lbl">Checker</span>
    </button>
    <button class="nav-btn" onclick="nav('exit',this)">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span class="nav-lbl">Exit</span>
    </button>
  </div>
</div>

<script>
const PROXY='https://api.allorigins.win/raw?url=';
const NSE_IDX_OC='https://www.nseindia.com/api/option-chain-indices?symbol=';
const NSE_EQ_OC='https://www.nseindia.com/api/option-chain-equities?symbol=';
const NSE_ALL='https://www.nseindia.com/api/allIndices';
const IDXS=['NIFTY','BANKNIFTY','FINNIFTY'];
const EQS=['RELIANCE','HDFCBANK','INFY','SBIN','ICICIBANK','TCS'];
const ALL=[...IDXS,...EQS];
let S={vix:null,chains:{},signals:[],updated:null};
let activeSym='NIFTY',fetching=false;

function tick(){
  const n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false});
  const h=n.getHours(),m=n.getMinutes();
  const open=(h>9||(h===9&&m>=15))&&(h<15||(h===15&&m<30));
  const p=document.getElementById('mkt-pill');
  p.className='pill '+(open?'p-mkt':'p-cls');
  p.textContent=open?'Open':'Closed';
}
setInterval(tick,1000);tick();

function nav(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('pg-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

async function get(url){
  const r=await fetch(PROXY+encodeURIComponent(url),{signal:AbortSignal.timeout(15000)});
  if(!r.ok)throw new Error(r.status);
  return r.json();
}

function parseChain(data,sym){
  const rec=data.records||{};
  const exps=rec.expiryDates||[];
  if(!exps.length)return null;
  const exp=exps[0],spot=rec.underlyingValue||0;
  let ce=0,pe=0;const rows=[];
  for(const it of(rec.data||[])){
    if(it.expiryDate!==exp)continue;
    const C=it.CE||{},P=it.PE||{};
    ce+=C.openInterest||0;pe+=P.openInterest||0;
    rows.push({strike:it.strikePrice,ceOI:C.openInterest||0,ceCOI:C.changeinOpenInterest||0,ceIV:+(C.impliedVolatility||0).toFixed(1),ceLTP:C.lastPrice||0,peOI:P.openInterest||0,peCOI:P.changeinOpenInterest||0,peIV:+(P.impliedVolatility||0).toFixed(1),peLTP:P.lastPrice||0});
  }
  if(!rows.length)return null;
  const pcr=ce>0?+(pe/ce).toFixed(2):0;
  const atm=rows.reduce((a,b)=>Math.abs(b.strike-spot)<Math.abs(a.strike-spot)?b:a);
  let ml=Infinity,mp=atm.strike;
  for(const c of rows){let l=0;for(const s of rows){if(c.strike>s.strike)l+=(c.strike-s.strike)*s.ceOI;if(c.strike<s.strike)l+=(s.strike-c.strike)*s.peOI;}if(l<ml){ml=l;mp=c.strike;}}
  const ai=rows.indexOf(atm),near=rows.slice(Math.max(0,ai-4),ai+5);
  const aci=+(near.filter(x=>x.ceIV>0).reduce((a,b)=>a+b.ceIV,0)/Math.max(1,near.length)).toFixed(1);
  const api=+(near.filter(x=>x.peIV>0).reduce((a,b)=>a+b.peIV,0)/Math.max(1,near.length)).toFixed(1);
  return{symbol:sym,spot,expiry:exp,pcr,ceTot:ce,peTot:pe,avgCeIV:aci,avgPeIV:api,maxPain:mp,atmStrike:atm.strike,atm,strikes:rows};
}

function signal(chain,vix){
  if(!chain)return null;
  const{spot,pcr,avgCeIV,avgPeIV,maxPain,atm,strikes}=chain;
  const v=vix||15;let ce=0,pe=0;const why=[];
  if(pcr<0.8){ce+=25;why.push('PCR '+pcr+' → bullish');}
  else if(pcr>1.2){pe+=25;why.push('PCR '+pcr+' → bearish');}
  if(avgPeIV>avgCeIV*1.1){pe+=20;why.push('PE IV '+avgPeIV+'% > CE IV → fear');}
  else if(avgCeIV>avgPeIV*1.1){ce+=20;why.push('CE IV '+avgCeIV+'% → demand');}
  if(v<14){ce+=15;why.push('VIX '+v+' low — trending');}
  else if(v>20){pe+=15;why.push('VIX '+v+' high — volatile');}
  if(spot>maxPain*1.005){ce+=15;why.push('Spot above max pain '+maxPain);}
  else if(spot<maxPain*0.995){pe+=15;why.push('Spot below max pain '+maxPain);}
  const tce=strikes.reduce((a,b)=>b.ceCOI>a.ceCOI?b:a,strikes[0]);
  const tpe=strikes.reduce((a,b)=>b.peCOI>a.peCOI?b:a,strikes[0]);
  if(tce.ceCOI>0){ce+=15;why.push('CE buildup +'+fmt(tce.ceCOI)+' @'+tce.strike);}
  if(tpe.peCOI>0){pe+=10;why.push('PE buildup +'+fmt(tpe.peCOI)+' @'+tpe.strike);}
  const dir=ce>=pe?'CE':'PE';const score=Math.max(ce,pe);
  if(score<35)return null;
  const sorted=[...strikes].sort((a,b)=>a.strike-b.strike);
  const ai=sorted.findIndex(s=>s.strike===atm.strike);
  const ch=dir==='CE'?sorted[Math.min(ai+1,sorted.length-1)]:sorted[Math.max(ai-1,0)];
  const ltp=dir==='CE'?ch.ceLTP:ch.peLTP;
  if(ltp<=0)return null;
  return{symbol:chain.symbol,type:dir,strike:ch.strike,premium:ltp,target:+(ltp*1.4).toFixed(1),sl:+(ltp*0.4).toFixed(1),iv:dir==='CE'?ch.ceIV:ch.peIV,pcr,oi:dir==='CE'?ch.ceOI:ch.peOI,score,verdict:score>=55?'buy':'watch',reasons:why.slice(0,3),expiry:chain.expiry};
}

function fmt(n){
  if(!n&&n!==0)return'—';
  const a=Math.abs(n),s=n<0?'-':'';
  if(a>=1e7)return s+(a/1e7).toFixed(1)+'Cr';
  if(a>=1e5)return s+(a/1e5).toFixed(1)+'L';
  return s+a.toLocaleString('en-IN');
}

async function fetchAll(){
  if(fetching)return;fetching=true;
  setSt('wait','Fetching live NSE data…');
  document.getElementById('conn-pill').className='pill p-off';
  document.getElementById('conn-pill').textContent='Fetching…';
  let done=0;const nc={};let vv=S.vix;
  try{const d=await get(NSE_ALL);const vi=(d.data||[]).find(x=>x.index==='India VIX');if(vi)vv=+vi.last.toFixed(2);}catch(e){}
  for(const sym of ALL){
    const isI=IDXS.includes(sym);
    try{const d=await get((isI?NSE_IDX_OC:NSE_EQ_OC)+sym);const c=parseChain(d,sym);if(c){nc[sym]=c;done++;}}catch(e){}
    await new Promise(r=>setTimeout(r,700));
  }
  if(done>0){
    S.vix=vv;S.chains=nc;
    S.signals=ALL.map(s=>signal(nc[s],vv)).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,5);
    S.updated=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    setSt('live','Live · '+S.updated+' · '+done+' symbols');
    document.getElementById('conn-pill').className='pill p-live';
    document.getElementById('conn-pill').textContent='● Live';
    render();
  }else{
    setSt('off','NSE unreachable. Tap Refresh to retry.');
    document.getElementById('conn-pill').className='pill p-off';
    document.getElementById('conn-pill').textContent='Offline';
  }
  fetching=false;
}

function setSt(t,m){
  document.getElementById('pulse').className='pulse-dot '+(t==='live'?'live':t==='off'?'off':'wait');
  document.getElementById('status-txt').textContent=m;
}

function render(){
  const v=S.vix;
  if(v){document.getElementById('vix-val').textContent=v;document.getElementById('vix-val').className='mc-v '+(v<14?'g':v>20?'r':'a');document.getElementById('vix-sub').textContent=v<14?'Low — trending':v>20?'High — volatile':'Moderate';}
  document.getElementById('sig-count').textContent=S.signals.length;
  // Signals
  const sl=document.getElementById('signals-list');
  sl.innerHTML=S.signals.length?S.signals.map(s=>`
    <div class="sig-card ${s.verdict}">
      <div class="sc-top"><span class="sc-sym">${s.symbol}</span><span class="badge ${s.type==='CE'?'bce':'bpe'}">${s.type} ${s.strike}</span></div>
      <div class="sc-grid">
        <div><div class="sc-fl">Premium</div><div class="sc-fv">₹${s.premium}</div></div>
        <div><div class="sc-fl">Target</div><div class="sc-fv g">₹${s.target}</div></div>
        <div><div class="sc-fl">Stop loss</div><div class="sc-fv r">₹${s.sl}</div></div>
        <div><div class="sc-fl">IV</div><div class="sc-fv">${s.iv}%</div></div>
        <div><div class="sc-fl">OI</div><div class="sc-fv">${fmt(s.oi)}</div></div>
        <div><div class="sc-fl">Score</div><div class="sc-fv b">${s.score}/100</div></div>
      </div>
      <div class="sc-reason">${s.reasons.join(' · ')}</div>
      <div class="sc-verdict ${s.verdict==='buy'?'sv-buy':'sv-watch'}">${s.verdict==='buy'?'✓ BUY at open — high confidence':'⏳ WATCH — wait for confirmation'}</div>
    </div>`).join(''):'<div class="err-box">No signals generated yet. Market may be closed, or NSE data is loading. Tap Refresh above.</div>';
  // OI
  document.getElementById('oi-list').innerHTML=Object.entries(S.chains).map(([sym,c])=>{
    const tot=c.ceTot+c.peTot;if(!tot)return'';
    const cp=Math.round(c.ceTot/tot*100),pp=100-cp;
    const col=c.pcr<0.8?'var(--grn)':c.pcr>1.2?'var(--red)':'var(--amb)';
    return`<div class="oi-item"><div class="oi-top"><span class="oi-sym">${sym} <span style="font-size:12px;color:var(--muted);font-weight:400">₹${c.spot.toLocaleString('en-IN')}</span></span><span class="oi-pcr" style="background:${col}22;color:${col}">PCR ${c.pcr}</span></div><div class="oi-track"><div class="oi-ce" style="width:${cp}%"></div><div class="oi-pe" style="width:${pp}%"></div></div><div class="oi-labels"><span style="color:var(--grn)">CE ${cp}% · ${fmt(c.ceTot)}</span><span style="color:var(--red)">PE ${pp}% · ${fmt(c.peTot)}</span></div></div>`;
  }).join('');
  // Chain tabs
  const syms=Object.keys(S.chains);
  if(!syms.includes(activeSym))activeSym=syms[0]||'NIFTY';
  document.getElementById('chain-tabs').innerHTML=syms.map(s=>`<div class="sym-tab ${s===activeSym?'on':''}" onclick="loadChain('${s}')">${s}</div>`).join('');
  if(S.chains[activeSym])renderChain(S.chains[activeSym]);
  // Exit
  const ex=document.getElementById('exit-list');
  if(!S.signals.length){ex.innerHTML='<div class="status-banner"><div class="pulse-dot wait"></div><span>Load signals first to monitor positions.</span></div>';return;}
  ex.innerHTML=S.signals.slice(0,3).map(s=>{
    const ch=S.chains[s.symbol];
    const f=ch&&ch.strikes.find(x=>x.strike===s.strike);
    const cur=f?(s.type==='CE'?f.ceLTP:f.peLTP):s.premium;
    const coi=f?(s.type==='CE'?f.ceCOI:f.peCOI):0;
    const pnl=s.premium>0?+((cur-s.premium)/s.premium*100).toFixed(1):0;
    const exit=(coi<-50000)||(cur>=s.target)||(cur<=s.sl);
    const why=cur>=s.target?'Target hit! Book full profit now.':cur<=s.sl?'Stop loss hit. Exit immediately.':coi<-50000?'OI unwinding — longs exiting. Exit now.':'Position intact. Hold.';
    return`<div class="exit-item" style="${exit?'border-color:rgba(239,68,68,0.4)':''}"><div class="ei-top"><span class="ei-sym">${s.symbol} ${s.type} ${s.strike}</span><span class="ei-badge ${exit?'ei-exit':'ei-hold'}">${exit?'EXIT':'HOLD'}</span></div><div class="ei-pnl ${pnl>=0?'g':'r'}">${pnl>=0?'+':''}${pnl}%</div><div class="ei-body">Entry ₹${s.premium} · Now ₹${cur}<br>${why}</div></div>`;
  }).join('');
}

function loadChain(sym){activeSym=sym;document.getElementById('chain-tabs').innerHTML=Object.keys(S.chains).map(s=>`<div class="sym-tab ${s===sym?'on':''}" onclick="loadChain('${s}')">${s}</div>`).join('');if(S.chains[sym])renderChain(S.chains[sym]);}

function renderChain(c){
  const atm=c.atmStrike,sorted=[...c.strikes].sort((a,b)=>a.strike-b.strike);
  const ai=sorted.findIndex(s=>s.strike===atm);
  const near=sorted.slice(Math.max(0,ai-5),ai+6);
  document.getElementById('chain-container').innerHTML=`<div style="display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap"><span>ATM <strong style="color:var(--blu)">${atm}</strong></span><span>Max Pain <strong style="color:var(--amb)">${c.maxPain}</strong></span><span>Expiry <strong style="color:var(--txt)">${c.expiry}</strong></span></div><div class="chain-wrap"><table class="chain-tbl"><thead><tr><th>CE OI</th><th>CE IV</th><th>STRIKE</th><th>PE IV</th><th>PE OI</th></tr></thead><tbody>${near.map(s=>`<tr class="${s.strike===atm?'atm':''}"><td class="cce">${fmt(s.ceOI)}</td><td>${s.ceIV||'—'}%</td><td class="cstrike">${s.strike}${s.strike===atm?' ★':''}</td><td>${s.peIV||'—'}%</td><td class="cpe">${fmt(s.peOI)}</td></tr>`).join('')}</tbody></table></div>`;
}

function runChecker(){
  const sym=document.getElementById('chk-sym').value.trim().toUpperCase();
  const strike=parseInt(document.getElementById('chk-strike').value.trim());
  const type=document.getElementById('chk-type').value;
  const el=document.getElementById('chk-result');
  if(!sym||isNaN(strike)){alert('Enter a symbol and strike price.');return;}
  el.style.display='block';
  const chain=S.chains[sym];
  if(!chain){el.innerHTML=`<div class="err-box">No data for ${sym} yet. Wait for data to load, then try again.</div>`;return;}
  const m=chain.strikes.find(s=>s.strike===strike);
  if(!m){el.innerHTML=`<div class="err-box">Strike ${strike} not found for ${sym}.</div>`;return;}
  const iv=type==='CE'?m.ceIV:m.peIV,ltp=type==='CE'?m.ceLTP:m.peLTP,oi=type==='CE'?m.ceOI:m.peOI,coi=type==='CE'?m.ceCOI:m.peCOI;
  let score=50;const why=[];
  if(iv<15){score+=15;why.push('IV '+iv+'% is low — cheap premium');}
  else if(iv>30){score-=20;why.push('IV '+iv+'% very high — expensive');}
  else{why.push('IV '+iv+'% is moderate');}
  if(coi>50000){score+=15;why.push(type+' OI rising +'+fmt(coi)+' — fresh buying');}
  else if(coi<0){score-=15;why.push('OI unwinding '+fmt(coi)+' — not ideal');}
  if(type==='CE'&&chain.pcr<1.0){score+=10;why.push('PCR '+chain.pcr+' supports CE');}
  if(type==='PE'&&chain.pcr>1.0){score+=10;why.push('PCR '+chain.pcr+' supports PE');}
  if(S.vix>20&&type==='PE'){score+=10;why.push('High VIX '+S.vix+' helps PE');}
  if(S.vix<14&&type==='CE'){score+=5;why.push('Low VIX '+S.vix+' — stable env');}
  score=Math.max(0,Math.min(100,score));
  const vc=score>=65?'var(--grn)':score>=45?'var(--amb)':'var(--red)';
  const vl=score>=65?'✓ Good to buy':score>=45?'⚠ Risky — wait':'✗ Avoid';
  el.innerHTML=`<div class="cr-top"><span class="cr-title">${sym} ${strike} ${type}</span><span class="badge" style="background:${vc}22;color:${vc}">${vl}</span></div><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:10px"><span>Score</span><span style="color:${vc};font-weight:700">${score}/100</span></div><div class="score-bar-bg"><div class="score-bar-fill" style="width:${score}%;background:${vc}"></div></div><div class="cr-grid"><div class="cr-cell"><div class="cr-cl">LTP</div><div class="cr-cv">₹${ltp}</div></div><div class="cr-cell"><div class="cr-cl">IV</div><div class="cr-cv">${iv}%</div></div><div class="cr-cell"><div class="cr-cl">OI</div><div class="cr-cv">${fmt(oi)}</div></div><div class="cr-cell"><div class="cr-cl">ΔOI</div><div class="cr-cv" style="color:${coi>=0?'var(--grn)':'var(--red)'}">${coi>=0?'+':''}${fmt(coi)}</div></div><div class="cr-cell"><div class="cr-cl">PCR</div><div class="cr-cv">${chain.pcr}</div></div><div class="cr-cell"><div class="cr-cl">VIX</div><div class="cr-cv">${S.vix||'—'}</div></div></div><div class="cr-reasons">${why.join('<br>')}</div>`;
}

fetchAll();
setInterval(()=>{const h=new Date().getHours();if(h>=9&&h<16)fetchAll();},45000);
</script>
</body>
</html>
